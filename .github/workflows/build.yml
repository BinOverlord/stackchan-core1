name: Build firmware

# Builds the M5Stack Core Gray firmware with PlatformIO and publishes the
# resulting binaries as a downloadable artifact on every push / PR.
# When a version tag (v*) is pushed, the flashable binaries are also attached
# to a GitHub Release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the Release on tag pushes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build (m5stack-grey)
        run: pio run -e m5stack-grey

      - name: Collect firmware binaries
        run: |
          mkdir -p artifact
          cp .pio/build/m5stack-grey/firmware.bin   artifact/ 2>/dev/null || true
          cp .pio/build/m5stack-grey/firmware.elf   artifact/ 2>/dev/null || true
          cp .pio/build/m5stack-grey/partitions.bin artifact/ 2>/dev/null || true
          cp .pio/build/m5stack-grey/bootloader.bin artifact/ 2>/dev/null || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-core-gray-firmware
          path: artifact/
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Attach the flashable images (skip the large .elf).
          files: |
            .pio/build/m5stack-grey/firmware.bin
            .pio/build/m5stack-grey/bootloader.bin
            .pio/build/m5stack-grey/partitions.bin
