# --------------------------------------------------------------------------
# SC_CalendarConfig.yaml
#
# Connection settings for the "calendar reminders" feature.
# Place this file on the SD card as /yaml/SC_CalendarConfig.yaml
# (SC_BasicConfig.yaml keeps controlling the avatar / speaker / LED / bluetooth).
#
# The parser used by this app is a small line based reader, so please keep the
# structure below (2 space indentation, `key: value`) and do not use YAML flow
# syntax (no `[ ]` or `{ }`).
# --------------------------------------------------------------------------

wifi:
  # Wi-Fi network the device joins to reach the remote calendar / serve the API.
  ssid: "your-wifi-ssid"
  password: "your-wifi-password"
  # Seconds to wait for the connection before giving up (device still boots).
  connect_timeout_sec: 20

calendar:
  # URL of the remote calendar in iCalendar (.ics) format.
  # Works with any public/secret-address ICS feed, e.g.:
  #   Google Calendar : "Settings > Secret address in iCal format"
  #   Outlook / Nextcloud / Apple iCloud published calendars, etc.
  # Both http:// and https:// URLs are supported.
  ics_url: "https://example.com/basic.ics"
  # How often to re-download the calendar (seconds).
  poll_interval_sec: 300
  # How long before an event starts the reminder should fire (seconds).
  reminder_lead_sec: 300
  # Maximum number of upcoming events to keep in memory.
  max_events: 20

time:
  # NTP is used to know the current time so reminders fire at the right moment.
  ntp_server: "pool.ntp.org"
  # Timezone offset from UTC in seconds. (default: Mexico City = UTC-6)
  gmt_offset_sec: -21600
  # Extra offset applied while daylight saving time is active (seconds).
  daylight_offset_sec: 0

reminder:
  # Play a chime on the M5Stack speaker when a reminder fires.
  tone_enabled: true
  # Show the event title in the avatar speech balloon.
  speak_enabled: true
  # How many times the chime melody repeats.
  chime_repeat: 2
  # Optional WAV file on the SD card to play instead of the built in chime.
  # Leave empty to use the built in chime. Example: "/sound/reminder.wav"
  sound_file: ""
  # Flash the GoBottom LEDs while a reminder is showing.
  led_flash: true

api:
  # Built in HTTP control API (REST). Lets you query/refresh the calendar,
  # change volume, trigger a test reminder and make Stack-chan speak.
  enabled: true
  port: 80
  # Optional bearer token. When set, requests must send
  #   Authorization: Bearer <token>
  # Leave empty to disable authentication.
  auth_token: ""
