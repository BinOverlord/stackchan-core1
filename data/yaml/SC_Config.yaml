# ==========================================================================
# SC_Config.yaml
#
# Single configuration file for the Stack-chan Calendar Reminder firmware
# (M5Stack Core Gray). Copy it to the SD card as /yaml/SC_Config.yaml.
#
# It holds every firmware setting:
#   * base Stack-chan settings (speaker volume, balloon font, LEDs), read by
#     the stackchan-arduino config loader, and
#   * the calendar-reminder settings (Wi-Fi, remote calendar, NTP/timezone,
#     reminder options, control API), read by this firmware.
#
# The calendar sections at the bottom are parsed by a small line reader, so
# keep 2-space indentation and `key: value` pairs there (no [ ] or { }).
# ==========================================================================

# --------------------------------------------------------------------------
# Base Stack-chan settings (stackchan-arduino)
# --------------------------------------------------------------------------
servo:
  # Servo control has been removed from this firmware. These keys are kept
  # only so the config document is complete; they have no effect.
  pin:
    x: 7
    y: 6
  offset:
    x: 0
    y: 0
  center:
    x: 150
    y: 90
  lower_limit:
    x: 0
    y: 0
  upper_limit:
    x: 300
    y: 90
  speed:
    normal_mode:
      interval_min: 3000
      interval_max: 6000
      move_min: 500
      move_max: 1500
    sing_mode:
      interval_min: 500
      interval_max: 1000
      move_min: 500
      move_max: 1000
servo_type: "M5_SCS"   # unused (servo removed)
takao_base: false      # unused (servo removed)

# Only start_volume is used (initial speaker volume, 0-255). The Bluetooth
# speaker feature has been removed; device_name / starting_state are ignored.
bluetooth:
  device_name: "M5Stack"
  starting_state: false
  start_volume: 100

auto_power_off_time: 0   # Core2 only; unused on Core Gray.

balloon:
  # "JA" or "CN" load a CJK font; anything else uses the Latin font.
  # This build's on-screen text is English, so the Latin font is used.
  font_language: ""
  lyrics:
  - "Hello"
  - "I'm Stack-chan"

led_lr: 0      # 0:stereo, 1:left only, 2:right only (LED level meter is unused)
led_pin: 15    # GoBottom1: 15, GoBottom2: 25

# Optional extension/secret config files (unused here).
extend_config_filename: ""
extend_config_filesize: 0
secret_config_filename: ""
secret_config_filesize: 0
secret_info_show: true

# --------------------------------------------------------------------------
# Calendar-reminder settings (this firmware)
# --------------------------------------------------------------------------
wifi:
  # Wi-Fi network the device joins to reach the remote calendar / serve the API.
  ssid: "your-wifi-ssid"
  password: "your-wifi-password"
  # Seconds to wait for the connection before giving up (device still boots).
  connect_timeout_sec: 20

calendar:
  # URL of the remote calendar in iCalendar (.ics) format. Works with any
  # public/secret-address ICS feed (Google Calendar secret iCal address,
  # published Outlook / Nextcloud / iCloud calendars, etc). http or https.
  ics_url: "https://example.com/basic.ics"
  # How often to re-download the calendar (seconds).
  poll_interval_sec: 300
  # How long before an event starts the reminder should fire (seconds).
  reminder_lead_sec: 300
  # Maximum number of upcoming events to keep in memory.
  max_events: 20

time:
  # NTP is used so reminders fire at the right moment.
  ntp_server: "pool.ntp.org"
  # Timezone offset from UTC in seconds. (default: Mexico City = UTC-6)
  gmt_offset_sec: -21600
  # Extra offset applied while daylight saving time is active (seconds).
  daylight_offset_sec: 0

reminder:
  # Play a chime on the speaker when a reminder fires.
  tone_enabled: true
  # Show the event title in the avatar speech balloon.
  speak_enabled: true
  # How many times the chime melody repeats.
  chime_repeat: 2
  # Optional WAV file on the SD card to play instead of the built-in chime.
  # Leave empty to use the built-in chime. Example: "/sound/reminder.wav"
  sound_file: ""
  # Flash the GoBottom LEDs while a reminder is showing.
  led_flash: true

api:
  # Built-in HTTP control API (REST + OTA firmware update).
  enabled: true
  port: 80
  # Optional bearer token. When set, requests must send
  #   Authorization: Bearer <token>
  # (OTA endpoints also accept it as ?token=<token>). Empty disables auth.
  auth_token: ""
