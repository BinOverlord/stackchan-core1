; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
; M5Stack Core Gray (Core1) is the primary target for this app.
default_envs = m5stack-grey

[env]
platform = espressif32 @ 6.12.0 ;6.4.0
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.filesystem = spiffs
board_build.partitions = default_16MB.csv
build_flags = -DCORE_DEBUG_LEVEL=4
;lib_extra_dirs = lib
lib_deps =
    meganetaaan/M5Stack-Avatar @ 0.10.0
    mongonta0716/stackchan-arduino@^0.0.7 ;
;    m5stack/M5UGFX
;    m5stack/M5Unified
    earlephilhower/ESP8266Audio @1.9.7
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.7.3
    FastLED/FastLED @ 3.6.0
    ; --- Calendar reminders + control API dependencies ---
    ; ArduinoJson 7.x: required by the YAMLDuino version that stackchan-arduino
    ; depends on (v6 breaks YAMLDuino's build), and used by the control API.
    bblanchon/ArduinoJson @ ^7.0.0
;    tobozo/M5Stack-SD-Updater@

lib_ldf_mode = deep
;タカヲ専用のリモート開発用スクリプト
;extra_scripts =
;    post:scripts/copy_firmware.py

[env:m5stack-grey]
; ★ M5Stack Core Gray (Core1). Use this env for the Basic V2.6 / Gray with 16MB Flash.
board = m5stack-grey
board_build.flash_mode = qio
; default_16MB.csv provides two OTA app partitions (ota_0/ota_1) + otadata,
; which the web based OTA update (POST /update) requires.
board_build.partitions = default_16MB.csv
board_upload_maximum_ram_size = 327680
build_flags = -DCORE_DEBUG_LEVEL=0

; --- Over-the-air (network) upload -------------------------------------------
; The firmware ships with a browser based updater at http://<device-ip>/update,
; so no special tooling is needed to flash a new build. If you would rather push
; builds straight from PlatformIO over Wi-Fi, uncomment the lines below and set
; upload_port to the device IP (shown by GET /status).
;upload_protocol = espota
;upload_port = 192.168.0.123
;upload_flags =
;    --auth=            ; only if you enable an OTA password

[env:m5stack-core2]
board = m5stack-core2

[env:m5stack-fire]
; fireはespressif32最新版(5.x)で動かない場合は下記の1行をコメントアウトしてください。
;platform = espressif32 @ 4.4.0
board = m5stack-fire

[env:m5stack-core-esp32]
; Flash 16MBのBasicはm5stack-greyを使ってください。
board = m5stack-core-esp32
board_build.flash_mode = qio
build_flags = -DCORE_DEBUG_LEVEL=0
; Flash 4MB
board_build.partitions = huge_app.csv

